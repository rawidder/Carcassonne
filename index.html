<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carcassonne Zählleiste</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Carcassonne">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f6b3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-column phone app. Score cards on top, scoring panel below, history at the end. */
:root{
  --bg:#eef0e6;        /* pale meadow */
  --surface:#fbfbf6;
  --line:#d3d6c4;
  --fg:#23271c;
  --muted:#656b58;
  --accent:#2f6b3a;    /* field green */
  --accent-fg:#ffffff;
  --road:#a88a5a;
  --danger:#a2342b;
  --display:"Grenze", Georgia, serif;
  --body:"Alegreya Sans", system-ui, -apple-system, sans-serif;
  --m-yellow:#e8b923; --m-red:#cc3b2f; --m-green:#3f8f3c; --m-blue:#2f62b5; --m-black:#2a2a2a; --m-grey:#9a9a9a; --m-pink:#d871a5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a13; --surface:#20251b; --line:#363d2d; --fg:#e8ead9; --muted:#9ea38c;
  --accent:#6cb377; --accent-fg:#10140d; --road:#c9a874; --danger:#e07067; --m-black:#0b0b0b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a13; --surface:#20251b; --line:#363d2d; --fg:#e8ead9; --muted:#9ea38c;
  --accent:#6cb377; --accent-fg:#10140d; --road:#c9a874; --danger:#e07067; --m-black:#0b0b0b; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px}
h2{font-size:22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button:disabled{opacity:.45;cursor:default}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.meeple{width:22px;height:22px;flex:none;background:var(--c);
  clip-path:polygon(50% 0,64% 6%,68% 22%,62% 34%,100% 44%,96% 58%,70% 56%,84% 100%,58% 100%,50% 80%,42% 100%,16% 100%,30% 56%,4% 58%,0 44%,38% 34%,32% 22%,36% 6%)}

/* setup */
.pl-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.pl-row input{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;padding-left:30px}
.sw{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;background:var(--c);border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.sw:disabled{opacity:.2}

/* scores */
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:0}
.card .name{display:flex;gap:8px;align-items:center;font-weight:700;min-width:0}
.card .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pts{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.card .track{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset;background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.card .lead{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hint{font-size:14px;color:var(--muted)}

/* mode + types */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;min-height:42px;padding:8px 6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toast{text-align:center}
.tg{min-height:40px;padding:6px 12px;font-size:15px}
.tg[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.exp{display:flex;flex-direction:column;gap:8px}
.exp label{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.exp input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.exp small{display:block;color:var(--muted);font-size:13px}
.types button{padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.types button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.ico{width:26px;height:26px}
.stepper{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper .ctl button{width:48px;height:48px;padding:0;font-size:24px;font-weight:700}
.stepper .val{min-width:44px;text-align:center;font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.stepper .what{font-weight:700}
.stepper .sub{font-size:13px;color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{min-height:38px;padding:6px 12px;font-variant-numeric:tabular-nums}
.result{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.result .big{font-family:var(--display);font-size:28px}
.result .who{font-size:14px;color:var(--muted)}
.result button{flex:1 1 160px}

/* history */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .dots{display:flex;gap:2px}
.hist .dots .meeple{width:16px;height:16px}
.hist .txt{min-width:0;font-size:15px}
.hist .txt small{display:block;color:var(--muted);font-size:12px}
.hist .p{font-weight:800;font-variant-numeric:tabular-nums}
.hist .del{min-height:32px;padding:4px 10px;font-size:13px}
.empty{color:var(--muted);font-size:15px}
.confirm{border:1px solid var(--danger);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card .pts.bump{animation:bump .35s ease}@keyframes bump{40%{transform:scale(1.15)}}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
const COLORS=[["yellow","Gelb"],["red","Rot"],["green","Grün"],["blue","Blau"],["black","Schwarz"],["grey","Grau"],["pink","Pink"]];
const EXPS=[
  ["e1","Wirtshäuser &amp; Kathedralen","Straßen mit Wirtshaus und Städte mit Kathedrale"],
  ["e2","Händler &amp; Baumeisterin","Waren-Mehrheiten und Wiesen mit Schwein"],
  ["abt","Der Abt","Gärten und vorzeitig zurückgeholter Abt"],
  ["gold","Die Goldminen","Goldbarren bei Spielende"],
  ["magic","Die Zauberkundigen","Magier +1 pro Plättchen, Hexe halbiert"],
  ["rob","Die Räuber","Räuber kassiert die Hälfte fremder Punkte"],
  ["dep","Die Depeschen","Botin als zweite Zählfigur"]
];
const TYPES={
  road:{n:"Straße",ico:'<svg class="ico" viewBox="0 0 26 26"><rect x="1" y="1" width="24" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1 13h24" stroke="currentColor" stroke-width="3"/></svg>'},
  city:{n:"Stadt",ico:'<svg class="ico" viewBox="0 0 26 26"><path d="M3 23V10h3v3h3V6h3v3h2V6h3v7h3v-3h3v13z" fill="currentColor"/></svg>'},
  cloister:{n:"Kloster",ico:'<svg class="ico" viewBox="0 0 26 26"><path d="M13 2v4M11 4h4M6 24V13l7-6 7 6v11z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 24v-5a2 2 0 0 1 4 0v5" fill="currentColor"/></svg>'},
  farm:{n:"Wiese",ico:'<svg class="ico" viewBox="0 0 26 26"><path d="M2 22c3-4 5-4 8 0M9 22c3-6 6-6 9 0M16 22c3-4 5-4 8 0M7 15l1-5M13 13V6M19 15l-1-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'},
  goods:{n:"Waren",exp:"e2",ico:'<svg class="ico" viewBox="0 0 26 26"><path d="M5 10h16l-2 13H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 10a4 4 0 0 1 8 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>'},
  gold:{n:"Gold",exp:"gold",ico:'<svg class="ico" viewBox="0 0 26 26"><path d="M3 21l3-7h8l3 7zM9 13l3-7h8l3 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'},
  robber:{n:"Räuber",exp:"rob",ico:'<svg class="ico" viewBox="0 0 26 26"><path d="M8 9c0-3 2-5 5-5s5 2 5 5M6 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 14h12v3a6 6 0 0 1-12 0z" fill="currentColor"/></svg>'},
  free:{n:"Frei",ico:'<svg class="ico" viewBox="0 0 26 26"><path d="M13 5v16M5 13h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>'}
};
const KEY="carcassonne-zaehler-v1";
const fresh=()=>({phase:"setup",end:false,players:COLORS.slice(0,2).map(([c])=>({name:"",color:c})),hist:[],exp:{}});
const FLAGS=["inn","cath","pig","mag","witch","garden","early"];
let S, ui={sel:[],type:"road",a:3,b:0,free:0,on:"m",confirm:false};
const EXP=()=>S.exp||(S.exp={});

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.players&&!s.example)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mp=c=>`<span class="meeple" style="--c:var(--m-${c})" aria-hidden="true"></span>`;
const sum=(i,f)=>S.hist.reduce((t,h)=>t+(h.p.includes(i)&&f(h)?h.pts:0),0);
const scores=()=>S.players.map((_,i)=>sum(i,()=>true));
const botin=i=>sum(i,h=>h.w==="b");
const field=n=>n%50;
const goldValue=n=>n*(n<=3?1:n<=6?2:n<=9?3:4);
function toast(t,ms){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,ms||1800)}

function calc(){
  const {type,a,b}=ui,end=S.end,x=EXP();
  const done=end?" (unfertig)":"";
  // Zauberkundige: Magier +1 pro Plättchen, Hexe halbiert (aufgerundet)
  const magic=(pts,l)=>{
    if(!x.magic||pts===0)return{pts,l};
    if(ui.mag)return{pts:pts+a,l:l+", Magier"};
    if(ui.witch)return{pts:Math.ceil(pts/2),l:l+", Hexe"};
    return{pts,l};
  };
  if(type==="road"){
    if(x.e1&&ui.inn)return magic(end?0:2*a,`Straße mit Wirtshaus · ${a} Plättchen${done}`);
    return magic(a,`Straße · ${a} Plättchen${done}`);
  }
  if(type==="city"){const t=`${a} Plättchen${b?`, ${b} Wappen`:""}${done}`;
    if(x.e1&&ui.cath)return magic(end?0:3*(a+b),`Stadt mit Kathedrale · ${t}`);
    return magic(end?a+b:2*(a+b),`Stadt · ${t}`)}
  if(type==="cloister"){const n=x.abt&&ui.garden?"Garten":"Kloster";
    if(end)return{pts:a,l:`${n} · unfertig, ${a} Plättchen`};
    if(x.abt&&ui.early)return{pts:a,l:`${n} · Abt zurückgeholt, ${a} Plättchen`};
    return{pts:9,l:`${n} · fertig`}}
  if(type==="farm"){const pig=x.e2&&ui.pig;return{pts:(pig?4:3)*a,l:`Wiese${pig?" mit Schwein":""} · ${a} fertige Städte`}}
  if(type==="goods")return{pts:10*a,l:`Waren · Mehrheit bei ${a} ${a===1?"Sorte":"Sorten"}`};
  if(type==="gold")return{pts:goldValue(a),l:`Gold · ${a} ${a===1?"Barren":"Barren"}`};
  if(type==="robber")return{pts:Math.ceil(a/2),l:`Räuber · Hälfte von ${a}`};
  return{pts:ui.free,l:ui.free<0?"Korrektur":"Freie Punkte"};
}
function defaults(){
  const t=ui.type;ui.b=0;FLAGS.forEach(f=>ui[f]=false);
  ui.a={road:3,city:2,cloister:S.end?5:9,farm:2,goods:1,gold:3,robber:6}[t]??0;ui.free=0;
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  app.innerHTML=S.phase==="setup"?setupView():gameView();
}
function setupView(){
  const used=S.players.map(p=>p.color);
  return `<div class="top"><h1>Neues Spiel</h1></div>
  <div class="panel"><div class="label">Anzahl Spieler</div>
  <div class="seg" role="group" aria-label="Anzahl Spieler">${[2,3,4,5,6].map(n=>`<button data-act="count" data-n="${n}" aria-pressed="${S.players.length===n}">${n}</button>`).join("")}</div>
  <div class="label">Namen und Farben</div>
  ${S.players.map((p,i)=>`<div class="pl-row">${mp(p.color)}
    <input id="pn${i}" data-act="name" data-i="${i}" value="${esc(p.name)}" placeholder="Spieler ${i+1}" maxlength="16" aria-label="Name Spieler ${i+1}">
    <div class="swatches">${COLORS.map(([c,n])=>`<button class="sw" style="--c:var(--m-${c})" data-act="col" data-i="${i}" data-c="${c}" aria-label="${n}" aria-pressed="${p.color===c}" ${used.includes(c)&&p.color!==c?"disabled":""}></button>`).join("")}</div>
  </div>`).join("")}
  </div>
  <div class="panel"><div class="label">Erweiterungen der BigBox</div><div class="exp">
    ${EXPS.map(([k,n,d])=>`<label><input type="checkbox" id="x-${k}" data-act="exp" data-e="${k}" ${EXP()[k]?"checked":""}><span>${n}<small>${d}</small></span></label>`).join("")}
    <div class="hint">Der Fluss, Die Fluggeräte, Die Fähren und Die Kornkreise ändern nichts an der Wertung und brauchen hier keinen Haken.</div></div></div>
  <button class="primary" data-act="start">Spiel starten</button>`;
}
function stepperHTML([w,s,k,min,mx]){
  return `<div class="stepper"><div><div class="what">${w}</div><div class="sub">${s}</div></div>
      <div class="ctl"><button data-act="step" data-k="${k}" data-d="-1" data-min="${min}" aria-label="weniger">−</button><span class="val">${ui[k]}</span><button data-act="step" data-k="${k}" data-d="1" data-max="${mx||99}" aria-label="mehr">+</button></div></div>`;
}
function gameView(){
  const x=EXP(),sc=scores(),max=Math.max(...sc),r=calc(),sel=ui.sel,t=ui.type;
  const names=sel.map(i=>S.players[i].name).join(", ");
  const cloisterCount=S.end||(x.abt&&ui.early);
  const steppers={
    road:[["Plättchen der Straße",x.e1&&ui.inn?"2 Punkte pro Plättchen (Wirtshaus)":"1 Punkt pro Plättchen","a",1]],
    city:[["Plättchen der Stadt",x.e1&&ui.cath?"3 Punkte pro Plättchen (Kathedrale)":S.end?"1 Punkt pro Plättchen":"2 Punkte pro Plättchen","a",1],
          ["Wappen",x.e1&&ui.cath?"je 3 Punkte":S.end?"je 1 Punkt":"je 2 Punkte","b",0]],
    cloister:cloisterCount?[[`Plättchen um und mit ${x.abt&&ui.garden?"Garten":"Kloster"}`,"1 Punkt pro Plättchen, max. 9","a",1,9]]:[],
    farm:[["Fertige Städte an der Wiese",(x.e2&&ui.pig)?"4 Punkte pro Stadt (Schwein)":"3 Punkte pro Stadt","a",0]],
    goods:[["Warensorten mit Mehrheit","Wein, Getreide, Stoff: je 10 Punkte","a",1,3]],
    gold:[["Goldbarren","1–3: je 1 · 4–6: je 2 · 7–9: je 3 · ab 10: je 4","a",1]],
    robber:[["Punkte der beraubten Wertung","Der Räuber bekommt die Hälfte, aufgerundet","a",1]],
    free:[]
  }[t];
  const tg=(k,txt)=>`<button class="tg" data-act="tg" data-k="${k}" aria-pressed="${!!ui[k]}">${txt}</button>`;
  const toggles=[
    t==="road"&&x.e1&&tg("inn","mit Wirtshaus"),
    t==="city"&&x.e1&&tg("cath","mit Kathedrale"),
    (t==="road"||t==="city")&&x.magic&&tg("mag","mit Magier"),
    (t==="road"||t==="city")&&x.magic&&tg("witch","mit Hexe"),
    t==="cloister"&&x.abt&&tg("garden","Garten"),
    t==="cloister"&&x.abt&&!S.end&&tg("early","Abt zurückgeholt"),
    t==="farm"&&x.e2&&tg("pig","mit Schwein")
  ].filter(Boolean).join("");
  const hints=[
    S.end&&((t==="road"&&ui.inn)||(t==="city"&&ui.cath))&&`Unfertig bei Spielende bringt ${ui.inn?"eine Straße mit Wirtshaus":"eine Stadt mit Kathedrale"} 0 Punkte. Ein Eintrag ist nicht nötig.`,
    t==="goods"&&"Bei Spielende bekommt, wer die meisten Marker einer Sorte hat, 10 Punkte. Bei Gleichstand alle Beteiligten.",
    t==="gold"&&"Goldbarren werden bei Spielende gewertet. Jeder zählt seine eigenen Barren.",
    t==="robber"&&"Oben den Besitzer des Räubers antippen, nicht den beraubten Spieler. Der behält seine Punkte.",
    t==="cloister"&&!S.end&&!(x.abt&&ui.early)&&`Ein fertiges ${x.abt&&ui.garden?"Garten":"Kloster"} mit allen 8 Nachbarn zählt immer 9 Punkte.${x.abt?" Holst du den Abt vorher zurück, tippe „Abt zurückgeholt“.":" Für unfertige Klöster auf „Schlusswertung“ umstellen."}`,
    t==="farm"&&!S.end&&"Wiesen werden erst bei der Schlusswertung gezählt.",
    t==="free"&&x.dep&&"Punkte aus Depeschen trägst du mit der passenden Wertung oder hier unter Frei ein."
  ].filter(Boolean).map(h=>`<div class="hint">${h}</div>`).join("");
  return `<div class="top"><h1>Carcassonne</h1>
    <div class="row"><button class="ghost" data-act="undo" ${S.hist.length?"":"disabled"}>↶ Rückgängig</button></div></div>
  <div><div class="label" style="margin-bottom:6px">Wer bekommt Punkte? Bei Gleichstand mehrere antippen.</div>
  <div class="scores">${S.players.map((p,i)=>{const bt=x.dep?botin(i):0,m=sc[i]-bt;
    return `<button class="card" style="--c:var(--m-${p.color})" data-act="sel" data-i="${i}" aria-pressed="${sel.includes(i)}">
    ${sc[i]===max&&max>0?`<span class="lead">vorn</span>`:""}
    <span class="name">${mp(p.color)}<span>${esc(p.name)}</span></span>
    <span class="pts" id="pts${i}">${sc[i]}</span>
    <span class="track">${x.dep?`Feld ${field(m)} · Botin ${field(bt)}`:sc[i]>=50?`Feld ${field(sc[i])} · ${Math.floor(sc[i]/50)}× herum`:`Feld ${sc[i]}`}</span></button>`}).join("")}</div></div>

  <div class="panel">
    <div class="seg" role="group" aria-label="Spielphase">
      <button data-act="end" data-v="0" aria-pressed="${!S.end}">Während des Spiels</button>
      <button data-act="end" data-v="1" aria-pressed="${S.end}">Schlusswertung</button></div>
    <div class="types">${Object.entries(TYPES).filter(([,ty])=>!ty.exp||x[ty.exp]).map(([k,ty])=>`<button data-act="type" data-t="${k}" aria-pressed="${t===k}">${ty.ico}${ty.n}</button>`).join("")}</div>
    ${toggles?`<div class="toggles">${toggles}</div>`:""}
    ${steppers.map(stepperHTML).join("")}
    ${hints}
    ${t==="free"?`${stepperHTML(["Punkte","Negativ für Korrekturen","free",-99,200])}
      <div class="quick">${[1,2,3,4,5,10].map(n=>`<button data-act="quick" data-n="${n}">+${n}</button>`).join("")}<button data-act="quick" data-n="0">0</button></div>`:""}
    ${x.dep?`<div><div class="label" style="margin-bottom:6px">Punkte ziehen mit</div><div class="seg" role="group" aria-label="Zählfigur">
      <button data-act="on" data-v="m" aria-pressed="${ui.on!=="b"}">Gefolgsmann</button>
      <button data-act="on" data-v="b" aria-pressed="${ui.on==="b"}">Botin</button></div></div>`:""}
    <div class="result"><div><div class="big">${r.pts>0?"+":""}${r.pts} Punkte</div>
      <div class="who">${sel.length?`für ${esc(names)}`:"Erst oben Spieler antippen"}</div></div>
      <button class="primary" data-act="add-score" ${sel.length&&r.pts!==0?"":"disabled"}>Eintragen</button></div>
  </div>

  <div class="panel"><h2>Verlauf</h2>
    ${S.hist.length?`<ol class="hist">${S.hist.map((h,j)=>({h,j})).reverse().map(({h,j})=>`<li>
      <span class="dots">${h.p.map(i=>mp(S.players[i]?.color||"grey")).join("")}</span>
      <span class="txt">${esc(h.p.map(i=>S.players[i]?.name).join(", "))}<small>${esc(h.l)}${h.w==="b"?" · Botin":""}</small></span>
      <span class="p">${h.pts>0?"+":""}${h.pts}</span>
      <button class="ghost del" data-act="del" data-j="${j}" aria-label="Eintrag löschen">✕</button></li>`).join("")}</ol>`
      :`<p class="empty">Noch keine Wertung. Spieler antippen, Art wählen, eintragen.</p>`}
  </div>

  ${ui.confirm?`<div class="confirm"><b>Neues Spiel anfangen?</b><span class="hint">Alle Punkte und der Verlauf werden gelöscht. Danach kannst du Spieler und Erweiterungen anpassen.</span>
    <div class="row"><button class="danger" data-act="new-yes">Ja, neu anfangen</button><button data-act="new-no">Abbrechen</button></div></div>`
   :`<div class="row"><button data-act="new">Neues Spiel</button><button class="ghost" data-act="players">Spieler &amp; Erweiterungen</button></div>`}`;
}

/* ---------- events ---------- */
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.act==="name"){S.players[+t.dataset.i].name=t.value;save()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.act==="exp"){EXP()[t.dataset.e]=t.checked;if(!TYPES[ui.type]||(TYPES[ui.type].exp&&!t.checked)){ui.type="road";defaults()}save()}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
  const d=b.dataset,i=+d.i;
  switch(d.act){
    case"col":S.players[i].color=d.c;break;
    case"tg":{const k=d.k;ui[k]=!ui[k];
      if(ui[k]&&k==="mag")ui.witch=false;if(ui[k]&&k==="witch")ui.mag=false;
      if(k==="early"&&ui.early)ui.a=Math.min(ui.a,9);
      if(ui.type==="cloister"&&!S.end)ui.a=ui.early?Math.min(ui.a,8):9;break}
    case"on":ui.on=d.v;break;
    case"count":{const n=+d.n;S.players=S.players.slice(0,n);
      while(S.players.length<n){const free=COLORS.map(c=>c[0]).find(c=>!S.players.some(p=>p.color===c));S.players.push({name:"",color:free})}break}
    case"start":
      S.players.forEach((p,k)=>{if(!p.name.trim())p.name=`Spieler ${k+1}`});
      S.phase="game";if(S.hist.some(h=>h.p.some(k=>k>=S.players.length)))S.hist=[];delete S.example;ui.sel=[];wake();break;
    case"sel":ui.sel=ui.sel.includes(i)?ui.sel.filter(x=>x!==i):[...ui.sel,i].sort();break;
    case"end":S.end=d.v==="1";defaults();break;
    case"type":ui.type=d.t;defaults();break;
    case"step":{const k=d.k,v=ui[k]+(+d.d);if(d.min!==undefined&&v<+d.min)return;if(d.max!==undefined&&v>+d.max)return;ui[k]=v;break}
    case"quick":ui.free=+d.n;break;
    case"add-score":{const r=calc(),x=EXP(),w=x.dep&&ui.on==="b"?"b":"m";
      const e={p:[...ui.sel],pts:r.pts,l:r.l};if(w==="b")e.w="b";S.hist.push(e);
      const who=ui.sel.slice();ui.sel=[];ui.on="m";
      // Depeschen: landet eine Zählfigur auf einem dunklen Feld (Vielfache von 5), gibt es eine Depesche
      const draw=x.dep?who.filter(k=>{const bt=botin(k),pos=w==="b"?bt:scores()[k]-bt;return pos>0&&pos%5===0}):[];
      toast(`+${r.pts} für ${who.map(k=>S.players[k].name).join(", ")}`+(draw.length?` · Depesche ziehen: ${draw.map(k=>S.players[k].name).join(", ")}`:""),draw.length?3500:1800);
      save();render();who.forEach(k=>document.getElementById("pts"+k)?.classList.add("bump"));return}
    case"undo":{const h=S.hist.pop();if(h)toast(`Rückgängig: ${h.l}`);break}
    case"del":S.hist.splice(+d.j,1);break;
    case"new":ui.confirm=true;break;
    case"new-no":ui.confirm=false;break;
    case"new-yes":S.hist=[];S.end=false;ui.confirm=false;ui.sel=[];
      S.phase="setup";break;
    case"players":S.phase="setup";ui.sel=[];
      if(S.example){S.players=[{name:"",color:"blue"},{name:"",color:"red"}];S.hist=[];}break;
  }
  save();render();
});
async function wake(){try{await navigator.wakeLock?.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.phase==="game")wake()});

function start(data){S=data&&data.S?data.S:load();if(data&&data.ui)ui=data.ui;render();if(S.phase==="game")wake()}
window.claude?.hot?.snapshot?.(()=>({S,ui}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
